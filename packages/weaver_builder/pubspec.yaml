name: weaver_builder
description: Builder for weaver package
version: 0.9.3
repository: https://github.com/easazade/weaver
issue_tracker: https://github.com/easazade/weaver/issues

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  weaver: ^0.9.3
  build: ">=3.0.0 <5.0.0"
  analyzer: '>=9.0.0 <11.0.0'
  source_gen: ">=4.0.0 <5.0.0"
  dart_style: ^3.1.1
  glob: ^2.1.2
  recase: ^4.1.0
  collection: ^1.19.1

dev_dependencies:
  build_runner: ^2.6.0
  lints: ^5.0.0
  test: ^1.24.0

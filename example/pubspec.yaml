name: example
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.4
  flutter: 3.38.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_weaver: any
  flutter_crystalline:
    git:
      url: https://github.com/easazade/crystalline.git
      path: packages/flutter_crystalline
      ref: 35a840a
  dart_mappable: ^4.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1  
  weaver_builder: any
  flutter_lints: ^5.0.0
  shadcn_ui: ^0.45.2
  crystalline_builder:
    git:
      url: https://github.com/easazade/crystalline.git
      path: packages/crystalline_builder
      ref: 35a840a
  dart_mappable_builder: ^4.6.4

dependency_overrides:
  weaver:
    path: ../packages/weaver
  weaver_builder:
    path: ../packages/weaver_builder
  flutter_weaver:
    path: ../packages/flutter_weaver
  crystalline_builder:
    git:
      url: https://github.com/easazade/crystalline.git
      path: packages/crystalline_builder
      ref: 35a840a
  flutter_crystalline:
    git:
      url: https://github.com/easazade/crystalline.git
      path: packages/flutter_crystalline   
      ref: 35a840a
  crystalline:
    git:
      url: https://github.com/easazade/crystalline.git
      path: packages/crystalline   
      ref: 35a840a

flutter:

  uses-material-design: true